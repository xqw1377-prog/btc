global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'aurora'
    static_configs:
      - targets: ['data-service:8000', 'strategy-service:8000', 'execution-service:8000', 'risk-service:8000']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
